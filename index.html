<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smoothbrain TTT</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

/* ===== CRT SHELL ===== */
.crt {
    position: relative;
    width: 100%;
    height: 100%;
    animation: crt-flicker 0.12s infinite;
}

.crt-inner {
    width: 100%;
    height: 100%;
    transform: perspective(1200px) scale(1.04) rotateX(0.4deg) rotateY(-0.4deg);
    filter: contrast(1.2) brightness(1.1);
}

/* ===== SCANLINES ===== */
.crt::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,120,0.04),
        rgba(0,255,120,0.04) 1px,
        rgba(0,0,0,0) 3px
    );
    z-index: 5;
    pointer-events: none;
}

/* ===== RGB PHOSPHOR MASK ===== */
.crt::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to right,
        rgba(255,0,0,0.04) 0px,
        rgba(0,255,0,0.04) 1px,
        rgba(0,0,255,0.04) 2px,
        rgba(0,0,0,0) 3px
    );
    mix-blend-mode: screen;
    z-index: 6;
    pointer-events: none;
}

/* ===== SYNC BAR ===== */
.sync {
    position: absolute;
    width: 100%;
    height: 10%;
    background: linear-gradient(
        to bottom,
        rgba(0,255,100,0),
        rgba(0,255,100,0.15),
        rgba(0,255,100,0)
    );
    animation: sync-roll 6s linear infinite;
    z-index: 4;
    pointer-events: none;
}

/* ===== VIGNETTE ===== */
.vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,0.55) 100%
    );
    z-index: 7;
    pointer-events: none;
}

/* ===== LAYOUT ===== */
.container {
    position: relative;
    width: 100%;
    height: 100%;
    filter: blur(0.4px);
}

/* ===== HEADER LOGO ===== */
.header {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

.header svg {
    width: 26vmin;
}

.title {
    margin-top: 8px;
    font-size: 2rem;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    color: #00ff66;
    letter-spacing: 0.2em;
    text-shadow:
        0 0 6px #00ff66,
        0 0 20px #00ff66;
}

/* ===== BRAIN ===== */
.brain-path {
    fill: none;
    stroke: #00ff66;
    stroke-width: 3;
    filter:
        drop-shadow(0 0 6px #00ff66)
        drop-shadow(0 0 16px #00ff66)
        blur(0.3px);
}

.header .brain-path {
    stroke-width: 2;
}

/* ===== IMAGE GALLERY ===== */
.gallery {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60vmin;
    height: 34vmin;
    max-width: 800px;
    max-height: 450px;
    border: 2px solid #00ff66;
    box-shadow:
        0 0 20px #00ff66,
        inset 0 0 20px #00ff66;
    overflow: hidden;
}

.gallery img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
    filter: drop-shadow(0 0 10px #00ff66) blur(0.2px);
}

.gallery img.active {
    opacity: 1;
}

/* ===== ANIMATIONS ===== */
@keyframes crt-flicker {
    0% { opacity: 1; }
    50% { opacity: 0.97; }
    100% { opacity: 1; }
}

@keyframes sync-roll {
    0% { top: -20%; }
    100% { top: 120%; }
}

/* ===== TEXT INFO BOX ===== */
.info-box {
    position: absolute;
    top: calc(50% + 20vmin);
    left: 50%;
    transform: translateX(-50%);
    width: 60vmin;
    max-width: 800px;
    padding: 14px 18px;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: 1.3rem;
    color: #00ff66;
    text-align: center;

    border: 2px solid #00ff66;
    box-shadow:
        0 0 12px #00ff66,
        inset 0 0 12px #00ff66;

    background: rgba(0, 0, 0, 0.6);
    text-shadow: 0 0 6px #00ff66;
}

</style>
</head>

<body>
<div class="crt">
    <div class="sync"></div>
    <div class="crt-inner">
        <div class="container">

<!-- ===== HEADER ===== -->
<div class="header">
<svg viewBox="0 0 400 300">
    <!-- Outline -->
    <path class="brain-path" d="
        M80,160 C40,140 40,80 90,70
        C110,20 190,20 200,60
        C230,20 310,30 320,80
        C360,90 360,150 320,160
        C330,200 300,230 260,220
        C240,260 160,260 140,220
        C100,240 70,210 80,160 Z"/>

    <!-- Left folds -->
    <path class="brain-path" d="M110 90 C90 110 100 140 120 150"/>
    <path class="brain-path" d="M120 70 C140 90 130 120 150 140"/>
    <path class="brain-path" d="M100 130 C120 160 110 190 140 200"/>

    <!-- Right folds -->
    <path class="brain-path" d="M290 90 C310 110 300 140 280 150"/>
    <path class="brain-path" d="M280 70 C260 90 270 120 250 140"/>
    <path class="brain-path" d="M300 130 C280 160 290 190 260 200"/>

    <!-- Center seam -->
    <path class="brain-path" d="M200 60 C190 110 190 170 200 220"/>
</svg>
<div class="title">Smoothbrain TTT</div>
</div>

<!-- ===== GALLERY ===== -->
<div class="gallery" id="gallery"></div>

        </div>
    </div>
    <div class="vignette"></div>
</div>

<div class="info-box">
    You are now joining Smoothbrain TTT. Your IQ score has been lowered. Do not resist.
<br><br>
	We try not to make the downloads too abysmal.
</div>

<script>
/* ===== IMAGE URLS ===== */
const images = [
    "https://i.imgur.com/rve5vKc.png",
    "https://i.imgur.com/WqLy5dI.jpeg",
    "https://i.imgur.com/BWnEg6m.png",
    "https://i.imgur.com/y9PPuQ6.jpeg",
    "https://i.imgur.com/9eSgzSZ.jpeg",
    "https://i.imgur.com/DrmT0Cg.png",
    "https://i.imgur.com/YCd989b.gif",
    "https://i.imgur.com/vbz7YiE.png",
    "https://i.imgur.com/VbStQpI.gif",
    "https://i.imgur.com/41QK7Cr.gif",
    "https://i.imgur.com/hRfZYv5.png",
    "https://i.imgur.com/6WrOQMw.gif",
	"https://i.imgur.com/hTgwnub.png",
];

const gallery = document.getElementById("gallery");
let index = 0;

images.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src;
    if (i === 0) img.classList.add("active");
    gallery.appendChild(img);
});

const imgs = gallery.querySelectorAll("img");

setInterval(() => {
    imgs[index].classList.remove("active");
    index = (index + 1) % imgs.length;
    imgs[index].classList.add("active");
}, 3000);
</script>
</body>
</html>
